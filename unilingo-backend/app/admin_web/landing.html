<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unilingo API</title>
  <link rel="icon" type="image/png" href="/admin-web/uni_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
      overflow: hidden;
    }
    /* Animated background orbs */
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; z-index: 0;
      animation: float 12s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: #3b82f6; top: -120px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -80px; right: -60px; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 60%; animation-delay: -8s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }
    .container {
      position: relative; z-index: 1;
      text-align: center; padding: 40px;
      max-width: 560px; width: 100%;
    }
    .logo {
      width: 120px; height: 120px; border-radius: 28px;
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3);
      margin-bottom: 32px;
      animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    h1 {
      font-size: 48px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: fadeUp 0.6s 0.2s both;
    }
    .subtitle {
      font-size: 18px; color: #94a3b8; font-weight: 400;
      margin-bottom: 48px;
      animation: fadeUp 0.6s 0.3s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cards {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      animation: fadeUp 0.6s 0.4s both;
    }
    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 20px; border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      text-decoration: none; color: #f1f5f9;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.3);
    }
    .card-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 16px;
    }
    .card-icon.docs { background: linear-gradient(135deg, #3b82f6, #6366f1); }
    .card-icon.admin { background: linear-gradient(135deg, #10b981, #059669); }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
    .version {
      margin-top: 40px; font-size: 13px; color: #475569;
      animation: fadeUp 0.6s 0.5s both;
    }
    .version a { color: #64748b; text-decoration: none; }
    .version a:hover { color: #94a3b8; }
    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @media (max-width: 480px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
      .logo { width: 90px; height: 90px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="container">
    <img src="/admin-web/uni_icon.png" alt="Unilingo" class="logo">
    <h1>Unilingo API</h1>
    <p class="subtitle">IELTS Speaking Practice Platform</p>

    <div class="cards">
      <a href="/docs" class="card">
        <div class="card-icon docs">📚</div>
        <div class="card-title">API Documentation</div>
        <div class="card-desc">Interactive Swagger UI to explore and test all API endpoints</div>
      </a>
      <a href="/admin-web/" class="card">
        <div class="card-icon admin">⚙️</div>
        <div class="card-title">Admin Console</div>
        <div class="card-desc">Manage users, blogs, exercises, and push notifications</div>
      </a>
    </div>

    <div class="version">
      <span class="pulse"></span>
      <a href="/health">v1.0.0 — System healthy</a>
    </div>
  </div>

  <script>
    // Check health and update status
    fetch('/health')
      .then(r => r.json())
      .then(d => {
        document.querySelector('.version a').textContent = `v${d.version} — System ${d.status}`;
      })
      .catch(() => {
        document.querySelector('.pulse').style.background = '#ef4444';
        document.querySelector('.version a').textContent = 'System unreachable';
      });
  </script>
</body>
</html>
